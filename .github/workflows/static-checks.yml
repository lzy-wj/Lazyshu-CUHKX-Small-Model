name: static-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public repository contents
        run: python tools/validate_repository.py
      - name: Compile Python source
        run: python -m compileall -q solution research_archive/src research_archive/scripts

